<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="page-card">
        {%if msg %}
        <div class='message-box-{{msg["status"]}}'>{{msg['detail']}} </div>
        {% endif %}
        <h1>Update Password</h1>
        <p class="subtitle">Edit password below.</p>

        <form action="/update-password" method="POST">
            <input type="hidden" name="id" value="{{id}}">
            <label for="name">Username:</label>
            <input id="name" type="text" name="username" value="{{data[0]['username']}}" readonly autocomplete = "off">
            <label for="Password:">Password::</label>
            <input id="Password:" type="password" name="password" placeholder='Enter new password' required autocomplete = "off">
            <div class="page-actions">
                <button type="submit">Update password</button>
                <button type="submit" class="third" formaction="/update-user-page/{{id}}" formmethod="GET" formnovalidate>Back</button>
            </div>
        </form>
    </div>    
</body>
</html>
