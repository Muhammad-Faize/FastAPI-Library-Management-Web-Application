<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Books</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="page-card">
        <h2>List of Books</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                    <th>Name</th>
                    <th>Author Name</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for book in books %}
                <tr>
                    <td>{{book.id}}</td>
                    <td>{{book.name}}</td>
                    <td>{{book.author_name}}</td>
                    <td><a class="icon-link" href="/update-book-page/{{book.id}}" aria-label="Edit book">✏️</a>
                    <a class="icon-link danger" href="/delete-book-page/{{book.id}}" aria-label="Delete book">🗑️</a></td>
                </tr>
                {% endfor%}
            </tbody>
        </table>
        </div>
        <div class="page-actions">
            <form action="/add-book-page" method="GET">
                <button type="submit">ADD</button>
            </form>
            <form action="/" method="GET">
                <button type="submit" class="secondary">Back to main page</button>
            </form>
        </div>
    </div>
</body>
</html>
