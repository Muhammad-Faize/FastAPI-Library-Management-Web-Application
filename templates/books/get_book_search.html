<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Books</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">

</head>
<body>
    <div class="page-card">
        <h1>Search Result</h1>
        {% if status == 'success'%}
            <p class="subtitle">Book found</p>
            <label for="book">Book</label>
            <input type="text" id="book" value="{{book.book_name}}" readonly>
            <label for="author">Author</label>
            <input type="text" id="author" value="{{book.author_name}}" readonly>
            <label for="quantity">Quantity</label>
            <input type="text" id="quantity" value="{{book.quantity}}" readonly>
            <label for="Issued">Issued Books</label>
            <input type="text" id="Issued" value="{{book.issued_books}}" readonly>
            <label for="remaining">Remaining Books</label>
            <input type="text" id="remaining" value="{{book.remaining_books}}" readonly>
        {% endif %}
        {% if status == 'failure'%}
            <p class="message-box-faliure">Book not found</p>
        {% endif %}

        <div class="page-actions">
            <a href="/get-book" class="third" style="display:inline-block;padding:10px 16px;border-radius:999px;background:rgb(230,233,235);color:var(--text);text-decoration:none;">Back</a>
        </div>
    </div>
</body>
</html>
