<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Book</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <form action="/update-book" method="POST">
        <label for="id">Id:</label>
        <input id='id' type="number" name="id" value={{id}} readonly>
        <label for="name">Name:</label>
        <input id='name' type="text" name="name" value="{{name}}" required>
        <label for="quantity">Quantity:</label>
        <input id='quantity' type="number" name="quantity" value="{{quantity}}" required>
        <button>Update</button>
        <button type="submit" class='third' formaction="/get-book" formmethod="GET" formnovalidate>
            Back
        </button>
    </form>
</body>
</html>
