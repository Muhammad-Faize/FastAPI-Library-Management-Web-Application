<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Book</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="page-card">
        <h1>Update Book</h1>
        <p class="subtitle">Adjust the book information below.</p>

        <form action="/update-book" method="POST">
            <input id="id" type="hidden" name="id" value="{{id}}" readonly>
            <label for="name">Name</label>
            <input id="name" type="text" name="name" value="{{name}}" required autocomplete = "off" >
            <label for="quantity">Quantity</label>
            <input id="quantity" type="number" name="quantity" value="{{quantity}}" required>

            <div class="page-actions">
                <button type="submit">Update Book</button>
                <button type="submit" class="third" formaction="/get-book" formmethod="GET" formnovalidate>Back</button>
            </div>
        </form>
    </div>
</body>
</html>
