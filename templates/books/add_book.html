<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="page-card">
        <h1>Add Book</h1>
        <p class="subtitle">Search for an author first, then add a new book linked to that author.</p>

        <form action="/search-author" method="POST">
            <label for="author">Search Author</label>
            <input type="text" value="{{search}}" name="search" id="author" placeholder="Search Author" required>
            <div class="page-actions">
                <button type="submit">Search</button>
                <a href="/get-book" class="third" style="display:inline-block;padding:10px 16px;border-radius:999px;background:rgb(230,233,235);color:var(--text);text-decoration:none;">Back</a>
            </div>
        </form>

        <form action="/add-book" method="POST">
            <input name="search" value="{{search}}" hidden>
            <input type="hidden" name="author_id" value="0">
            {% if search %}
                {% if results %}
                    <h3>Select Author</h3>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Select</th>
                                    <th>Name</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for result in results %}
                                <tr>
                                    <td>
                                        <input type="radio" name="author_id" value="{{result.id}}">
                                    </td>
                                    <td>{{ result.name }}</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                    <label for="name">Book Name</label>
                    <input id="name" type="text" name="name" placeholder="Enter book name" required>
                    <label for="quantity">Book quantity</label>
                    <input id="quantity" type="number" min="1" name="quantity" placeholder="Enter Quantity" required>
                    <div class="page-actions">
                        <button type="submit">Add Book</button>
                    </div>
                {% else %}
                    <input class='message-box-faliure' value='No author found' readonly>
                    <label for="name">Book Name</label>
                    <input id="name" type="text" name="name" placeholder="Enter book name" required>
                    <label for="quantity">Book quantity</label>
                    <input id="quantity" type="number" min="1" name="quantity" placeholder="Enter Quantity" required>
                    <div class="page-actions">
                        <button type="submit">Add Book</button>
                    </div>
                {% endif %}
            {% endif %}
        </form>
    </div>
</body>
</html>
