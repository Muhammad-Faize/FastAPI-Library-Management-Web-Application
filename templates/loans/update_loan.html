<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update loan</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="page-card">
        <h1>Update Loan</h1>
        <p class="subtitle">Change the loan details for the selected borrower and book.</p>

        <form action="/update-loan" method="POST">
            <input id="id" type="hidden" name="id" value="{{id}}" readonly>
            <label for="borrower">Borrower</label>
            <select id="borrower" name="borrower_id" required>
                <option value="{{o_borrower}}">{{o_borrower_name}}</option>
                {%for borrower in borrowers%}
                    {% if borrower['id'] != o_borrower %}
                        <option value="{{borrower['id']}}">{{borrower['name']}}</option>
                    {% endif %}
                {% endfor %}
            </select>
            <label for="book">Book</label>
            <select id="book" name="book_id" required>
                <option value="{{o_book}}">{{o_book_name}}</option>
                {%for book in books%}
                    {% if book['book_id'] != o_book %}
                        <option value="{{book['book_id']}}">{{book['book_name']}}</option>
                    {% endif %}
                {% endfor %}
            </select>
            <label for="issued_books">Issued Books</label>
            <input type="number" value="{{issued_books}}" name="issued_books" id="issued_books">

            <div class="page-actions">
                <button type="submit">Update Loan</button>
                <button type="submit" class="third" formaction="/get-loan" formmethod="GET" formnovalidate>Back</button>
            </div>
        </form>
    </div>
</body>
</html>
