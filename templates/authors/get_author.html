<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All_Authors</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="page-card">
        <h2>Lists of Authors</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
            {% for author in authors %}
            <tr>
                <td>{{ author.name }}</td>
                <td><a class="icon-link" href="/update-author-page/{{author.id}}" aria-label="Edit author">✏️</a>
                <a class="icon-link danger" href="/delete-author/{{author.id}}" onclick='alert("Are you sure you want to delete!")' aria-label="Delete author">🗑️</a></td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
        </div>
        <div class="page-actions">
            <form action="/add-author-page" method="GET">
                <button type="submit">ADD</button>
            </form>
            <form action="/" method="GET">
                <button type="submit" class="secondary">Back to main page</button>
            </form>
        </div>
    </div>
</body>
</html>
