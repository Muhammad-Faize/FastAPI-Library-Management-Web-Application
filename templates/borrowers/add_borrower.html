<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add borrower</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="page-card">
        <h1>Add Borrower</h1>
        <p class="subtitle">Register a person who can borrow books from the library.</p>

        <form action="/add-borrower" method="POST">
            <label for="name">Name</label>
            <input id='name' type="text" name="name" placeholder="Enter Borrower Name" required>

            <div class="page-actions">
                <button type="submit">Add Borrower</button>
                <button type="submit" class='third' formaction="/get-borrower" formmethod="GET" formnovalidate>Back</button>
            </div>
        </form>
    </div>
</body>
</html>
