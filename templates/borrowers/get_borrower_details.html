<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrower Detail</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="page-card">
        <h1>Borrower Details</h1>
        <p class="subtitle">Detailed view of borrowed books for this borrower.</p>

        <input id="id" type="hidden" value="{{borrower['id']}}" readonly>
        <label for="name">Name</label>
        <input id="name" type="text" value="{{borrower['name']}}" readonly>

        <h3 style="margin-top:18px">Borrowed Books</h3>
        <div class='table-responsive'>
            <table>
                <thead>
                    <th>Name</th>
                    <th>Issued copies</th>
                </thead>
                <tbody>
                    {% for book in borrower_books%}
                    <tr>
                        <td>{{book['book_name']}}</td>
                        <td>{{book['issued_books']}}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="page-actions">
            <a href="/get-borrower" class="third" style="display:inline-block;padding:10px 16px;border-radius:999px;background:rgb(230,233,235);color:var(--text);text-decoration:none;">Back</a>
        </div>
    </div>
</body>
</html>
