<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Borrower</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="page-card">
        <h1>Update Borrower</h1>
        <p class="subtitle">Modify the borrower information below.</p>

        <form action="/update-borrower" method="POST">
            <input id="id" type="hidden" value="{{id}}" name="id" readonly>
            <label for="name">Name</label>
            <input id="name" type="text" value="{{name}}" name="name" autocomplete = "off" required>

            <div class="page-actions">
                <button type="submit">Update Borrower</button>
                <button type="submit" class="third" formaction="/get-borrower" formmethod="GET" formnovalidate>Back</button>
            </div>
        </form>
    </div>
</body>
</html>
