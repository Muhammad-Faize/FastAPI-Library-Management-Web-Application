<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Borrower</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="page-card">
        <h2>Lists of Borrowers</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Id</th>
                    <th>Name</th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for borrower in borrowers %}
                <tr>
                    <td>{{borrower.id}}</td>
                    <td>{{borrower.name}}</td>
                    <td><a class="icon-link" href="/update-borrower-page/{{borrower.id}}" aria-label="Edit borrower">✏️</a></td>
                    <td><a class="icon-link danger" href="/delete-borrower-page/{{borrower.id}}" aria-label="Delete borrower">🗑️</a></td>
                </tr>
                {%endfor%}
            </tbody>
        </table>
        </div>
        <div class="page-actions">
            <form action="/add-borrower-page" method="GET">
                <button type="submit">Add</button>
            </form>
            <form action="/" method="GET">
                <button type="submit" class="secondary">Back to main page</button>
            </form>
        </div>
    </div>
</body>
</html>
